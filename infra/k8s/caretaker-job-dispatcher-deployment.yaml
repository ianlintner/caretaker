---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caretaker-job-dispatcher
  namespace: caretaker
  labels:
    app: caretaker-job-dispatcher

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caretaker-job-dispatcher-binding
  namespace: caretaker
subjects:
  - kind: ServiceAccount
    name: caretaker-job-dispatcher
    namespace: caretaker
roleRef:
  kind: Role
  name: caretaker-agent-worker-job-creator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caretaker-job-dispatcher
  namespace: caretaker
  labels:
    app: caretaker-job-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caretaker-job-dispatcher
  template:
    metadata:
      labels:
        app: caretaker-job-dispatcher
    spec:
      serviceAccountName: caretaker-job-dispatcher
      containers:
        - name: dispatcher
          image: gabby.azurecr.io/caretaker-mcp:latest
          imagePullPolicy: Always
          args: ["python", "-m", "caretaker.coding_jobs.dispatcher_main"]
          # Force line-buffered stdout/stderr so crash logs aren't lost
          # in the stdio buffer — same fix as 2026-04-30 postmortem.
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CARETAKER_ASB_NAMESPACE
              value: "thebiggestboy.servicebus.windows.net"
            - name: CARETAKER_CODING_JOBS_K8S_WORKER_IMAGE
              value: "gabby.azurecr.io/caretaker-mcp:latest"
            - name: OTEL_SERVICE_NAME
              value: "caretaker-job-dispatcher"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.default.svc.cluster.local:4317"
            - name: AZURE_CLIENT_ID
              value: "e502213f-1f15-4f03-9fb4-b546f51aafe9"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: caretaker-secrets
                  key: redis-url
                  optional: true
          resources:
            requests:
              cpu: "50m"
              # Raised from 128Mi: steady-state observed at 140Mi (kubectl top).
              memory: "192Mi"
            limits:
              cpu: "200m"
              # Raised from 256Mi to give headroom above the 192Mi request
              # and absorb Redis-stream replay spikes.
              memory: "384Mi"
