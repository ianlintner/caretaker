# .github/maintainer/config.yml
# Generated by caretaker setup — customize as needed.
version: v1

orchestrator:
  schedule: daily
  summary_issue: true
  dry_run: false

pr_agent:
  enabled: true
  auto_merge:
    copilot_prs: true
    dependabot_prs: true
    human_prs: false
    merge_method: squash
  copilot:
    max_retries: 2
    retry_window_hours: 24
    context_injection: true
  ci:
    flaky_retries: 1
    ignore_jobs: []
  review:
    nitpick_threshold: low

issue_agent:
  enabled: true
  auto_assign_bugs: true
  auto_assign_features: false
  auto_close_stale_days: 30
  auto_close_questions: true
  labels:
    bug: ["bug"]
    feature: ["enhancement", "feature"]
    question: ["question"]

upgrade_agent:
  enabled: true
  strategy: auto-minor # auto-minor | auto-patch | latest | pinned

devops_agent:
  enabled: true
  target_branch: main
  max_issues_per_run: 3
  dedup_open_issues: true

self_heal_agent:
  enabled: true
  report_upstream: true

security_agent:
  enabled: true
  min_severity: medium
  max_issues_per_run: 5
  false_positive_rules: []
  include_dependabot: true
  include_code_scanning: true
  include_secret_scanning: true

dependency_agent:
  enabled: true
  auto_merge_patch: true
  auto_merge_minor: true
  merge_method: squash
  post_digest: true

docs_agent:
  enabled: true
  lookback_days: 7
  changelog_path: CHANGELOG.md
  update_readme: false

charlie_agent:
  enabled: true
  stale_days: 14
  close_duplicate_issues: true
  close_duplicate_prs: true
  close_stale_issues: true
  close_stale_prs: true
  exempt_labels:
    - pinned
    - maintainer:escalated
    - maintainer:escalation-digest

stale_agent:
  enabled: true
  stale_days: 60
  close_after: 14
  close_stale_prs: true
  delete_merged_branches: true
  exempt_labels:
    - pinned
    - security
    - security:finding
    - dependencies:major-upgrade
    - caretaker:self-heal
    - devops:build-failure

human_escalation:
  enabled: true
  post_digest_issue: true
  notify_assignees: []

escalation:
  targets: []
  stale_days: 7
  labels: ["maintainer:escalated"]

# Fleet registry — opt this repo into the central caretaker admin dashboard.
#
# When enabled, every orchestrator run posts a small JSON heartbeat (mode,
# enabled agents, goal_health, error_count, agent counters, attribution) to
# the configured endpoint. The dashboard at https://caretaker.cat-herding.net
# uses these heartbeats to render the Fleet view, fire ghosted/health-regression
# alerts, and promote globally-useful skills across repos.
#
# The heartbeat is fire-and-forget — failures NEVER fail the workflow run.
# It carries no source code; only the public summary fields above.
#
# Authentication: OAuth2 client_credentials only. The backend validates the
# `Authorization: Bearer <jwt>` header against the configured OIDC issuer
# (roauth2.cat-herding.net) and requires scope `fleet:heartbeat`.
#
# To opt in:
#   1. Set fleet_registry.enabled: true below.
#   2. Provision a per-repo OAuth2 client (see docs/fleet-opt-in-runbook.md).
#   3. Add OAUTH2_CLIENT_ID + OAUTH2_CLIENT_SECRET as repo SECRETS, and
#      OAUTH2_TOKEN_URL + OAUTH2_SCOPE as repo VARIABLES. The maintainer
#      workflow already wires them into the run env.
#   4. Push. The first scheduled run will register the repo with the dashboard.
#
# See docs/fleet-registry.md in the caretaker repo for protocol details.
fleet_registry:
  enabled: false
  endpoint: https://caretaker.cat-herding.net/api/fleet/heartbeat
  timeout_seconds: 5.0
  # When true, the full RunSummary is sent (more debuggable on the central side
  # but also leaks more about per-PR details). Default is false: only the
  # 20-ish curated counter / health fields go up.
  include_full_summary: false
  oauth2:
    enabled: true
    client_id_env: OAUTH2_CLIENT_ID
    client_secret_env: OAUTH2_CLIENT_SECRET
    token_url_env: OAUTH2_TOKEN_URL
    scope_env: OAUTH2_SCOPE
    default_scope: "fleet:heartbeat"
    timeout_seconds: 10.0

llm:
  claude_enabled: auto
  claude_features:
    - ci_log_analysis
    - architectural_review
    - issue_decomposition

  # Capability-tag → concrete-model registry consumed by the consensus engine.
  # When a decision site opts into consensus (under `agentic.<site>.consensus`),
  # tag values like `fast` / `reasoning_anthropic` resolve here. Empty by default.
  model_pool:
    pool: {}
    # Example (commented out) — uncomment + edit for your provider mix:
    # pool:
    #   fast: claude-haiku-4-5
    #   reasoning_anthropic: claude-sonnet-4-6
    #   reasoning_alt: openai/gpt-4o
    #   cheap: claude-haiku-4-5

# Per-site consensus engine opt-in. Defaults are mode=off / consensus=null
# so adding the `llm.model_pool` above does NOT change behaviour until a
# site opts in. Uncomment + customize the examples below to enable.
#
# agentic:
#   # Cross-provider two-model agreement on PR readiness verdicts.
#   readiness:
#     mode: enforce
#     consensus:
#       strategy: always_two_models
#       primary: reasoning_anthropic
#       escalation: [reasoning_alt]
#       agreement_fields: [verdict]
#
#   # Cheap-fast tier with reasoning escalation on low-confidence calls.
#   size_classifier:
#     mode: enforce
#     consensus:
#       strategy: tiered_confidence
#       primary: fast
#       escalation: [reasoning_anthropic]
#       confidence_threshold: 0.7

# Optional: foundry-backed in-process coding executor.
# When foundry.enabled is false (default), every coding task continues to be
# routed to @copilot via the existing comment protocol — zero behavior change.
# To enable: set AZURE_AI_API_KEY + AZURE_AI_API_BASE in your workflow env,
# flip enabled below, and optionally set provider: auto (recommended).
#
# executor:
#   provider: copilot      # copilot | foundry | auto
